[project]
name = "auty"
version = "0.1.0"
description = "Real-time facial recognition with personality-driven HUD"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "deepface>=0.0.90",
    "mediapipe>=0.10.9",
    "tensorflow>=2.16.0",
    "tf-keras>=2.16.0",
    "protobuf>=6.31.1,<8",
]

[project.optional-dependencies]
voice = [
    "pyttsx3>=2.90",
    "SpeechRecognition>=3.10.0",
    "sounddevice>=0.4.6",
]
